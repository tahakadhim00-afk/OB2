name: CI

on:
  push:
    branches: [master, "phase-*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # 8.0 runtime runs the tests; 9.0 SDK matches the development machine.
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore OB2.sln

      - name: Build (Release)
        run: dotnet build OB2.sln -c Release --no-restore

      - name: Test
        run: dotnet test OB2.sln -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
